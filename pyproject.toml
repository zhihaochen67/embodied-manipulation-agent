[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "embodied-manipulation-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "pybullet",
    "numpy",
    "opencv-python",
    "pandas",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
include = ["embodied_manipulation*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
